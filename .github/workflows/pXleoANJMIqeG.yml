                core.info(`COMMIT_OK attempt=${h0WApd} sha=${xMM.commit.sha} msg=${ar6Jyx}`);
                return;
              } catch (brSg) {
                dtMD = brSg;
                if (brSg.status === 409 && h0WApd < 3) {
                  core.warning(`Conflict on attempt ${h0WApd}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1500 * h0WApd));
